# Автодеплой основного сайта (Vite) на Cloudflare Pages.
# Использует те же секреты, что и бот:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Проект Pages: avto-korea (создаётся при первом запуске).

name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore:
      - "dkp-bot/**"
      - ".github/workflows/deploy-dkp-bot.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: "/"
      - name: Create Pages project (idempotent)
        run: npx -y wrangler@3 pages project create avto-korea --production-branch=main || true
      - name: Deploy to Cloudflare Pages
        run: npx -y wrangler@3 pages deploy dist --project-name=avto-korea --branch=main --commit-dirty=true
