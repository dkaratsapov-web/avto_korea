# Сборка сайта (Vite) и выгрузка на виртуальный хостинг reg.ru по FTP.
# Включается переменной ENABLE_REGRU=true.
# Миграция активирована: 30.07.2026 (DNS переключен на reg.ru, secrets/vars установлены).
#
# Настроить (GitHub → Settings → Secrets and variables → Actions):
#   Secrets:
#     REGRU_FTP_SERVER    — FTP-хост (напр. server123.hosting.reg.ru или IP)
#     REGRU_FTP_USERNAME  — FTP-логин (напр. u3591059)
#     REGRU_FTP_PASSWORD  — FTP-пароль
#   Variables:
#     ENABLE_REGRU=true
#     (необяз.) REGRU_FTP_PROTOCOL = ftps | ftp   (по умолчанию ftps)
#     (необяз.) VITE_SITE_URL      = https://автоимпорт-69.рф
#     (необяз.) VITE_LEAD_ENDPOINT = URL воркера (бот остаётся на Cloudflare)

name: Deploy site to reg.ru

on:
  push:
    branches: [main, claude/beautiful-goodall-irzq2f]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.ENABLE_REGRU == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: "/"
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://автоимпорт-69.рф' }}
          # Заявки принимает PHP-обработчик на хостинге в РФ (152-ФЗ, ст. 18 ч. 5):
          # первичная запись сохраняется в России, уведомление в Telegram уходит
          # уже с сервера. Каталог/отзывы сайт по-прежнему читает из воркера.
          VITE_LEAD_ENDPOINT: ${{ vars.VITE_LEAD_ENDPOINT || '/api/lead.php' }}
          # Все запросы к данным бота идут на сам сайт: домен воркера
          # (*.workers.dev) в России блокируется провайдерами, поэтому за
          # данными и медиа ходит сервер (public/api/proxy.php, media.php).
          VITE_API_BASE: ${{ vars.VITE_API_BASE || '/' }}

      - name: Deploy dist → reg.ru (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.REGRU_FTP_SERVER }}
          username: ${{ secrets.REGRU_FTP_USERNAME }}
          password: ${{ secrets.REGRU_FTP_PASSWORD }}
          protocol: ${{ vars.REGRU_FTP_PROTOCOL || 'ftps' }}
          # Папка сайта на хостинге. FTP-пользователь попадает сразу в домашний
          # каталог, где лежит www/, поэтому путь начинается с /www/.
          # Имя папки — punycode домена сайта. На виртуальном хостинге reg.ru
          # папку задаёт панель по имени сайта, выбрать её нельзя, поэтому при
          # переезде на автоимпорт-69.рф поменялся и путь выгрузки.
          # Старая папка (xn-------43dmrgqjdwfo7afdrp6a6jvg.xn--p1ai) осталась
          # за прежним доменом: там лежит .htaccess с 301 на новый адрес.
          server-dir: /www/xn---69-5cdk0b2aocjmsg.xn--p1ai/
          local-dir: ./dist/
          # Не «чистим» папку целиком — только синхронизируем изменения.
          dangerous-clean-slate: false
