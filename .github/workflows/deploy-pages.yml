name: Deploy preview to GitHub Pages

# Превью-витрина «ДиАвто69» на GitHub Pages.
# Статический экспорт Next.js (без серверного /api/lead — на статике он не нужен,
# форма работает в демо-режиме). Боевой деплой — Cloudflare Pages / Vercel.

on:
  push:
    branches:
      - claude/beautiful-goodall-irzq2f
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Remove server route (not supported in static export)
        run: rm -rf app/api

      - name: Build static export
        run: npm run build
        env:
          GH_PAGES: "true"
          NEXT_PUBLIC_DEMO: "true"
          NEXT_PUBLIC_BASE_PATH: /avto_korea
          NEXT_PUBLIC_SITE_URL: https://dkaratsapov-web.github.io/avto_korea
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Disable Jekyll (keep _next assets)
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
