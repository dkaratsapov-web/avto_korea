# Автодеплой ДКП-бота в Cloudflare при пуше.
# Публикует Worker (dkp-bot) и Mini App (Pages-проект dkp-mini).
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — токен с правами: Workers Scripts (Edit), Pages (Edit)
#   CLOUDFLARE_ACCOUNT_ID — ID аккаунта Cloudflare
#
# Секреты самого бота (TELEGRAM_BOT_TOKEN, ANTHROPIC_API_KEY) задаются ОДИН раз
# в дашборде Cloudflare (Worker → Variables and Secrets → Secret) и сохраняются
# между деплоями — в репозиторий они не попадают.

name: Deploy DKP bot

on:
  push:
    branches: [main, claude/beautiful-goodall-irzq2f]
    paths:
      - "dkp-bot/**"
      - ".github/workflows/deploy-dkp-bot.yml"
  workflow_dispatch:

jobs:
  deploy-worker:
    if: ${{ vars.ENABLE_DKP_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dkp-bot
          command: deploy

  deploy-mini-app:
    if: ${{ vars.ENABLE_DKP_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Pages project (idempotent)
        run: npx -y wrangler@3 pages project create dkp-mini --production-branch=main || true
      - name: Deploy Mini App (Pages)
        run: npx -y wrangler@3 pages deploy dkp-bot/web --project-name=dkp-mini --branch=main --commit-dirty=true
